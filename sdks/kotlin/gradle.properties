group=ai.nrouter
version=3.1.0
org.gradle.jvmargs=-Xmx1g

kotlin.code.style=official

# Homebrew JDKs are not on Gradle's auto-detection path on macOS. Naming them
# explicitly is what lets `jvmToolchain(11)` resolve without a download.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@11/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@23/libexec/openjdk.jdk/Contents/Home
