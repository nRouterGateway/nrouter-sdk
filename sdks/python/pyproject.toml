[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrouter-sdk"
version = "3.1.0"
description = "nRouter SDK — one API key for models across six provider clouds. Native OpenAI and Anthropic wire formats, plus embeddings, audio, images and video."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "nRouter", email = "hello@nrouter.ai" },
]
keywords = ["llm", "ai", "nrouter", "gateway", "llm-gateway", "openai", "anthropic", "claude", "bedrock", "vertex-ai", "azure", "qwen", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# MEASURED 2026-08-31. The previous floors were `openai>=1.66.0` and
# `httpx>=0.24.1` against `requires-python = ">=3.8"`, and that combination was
# incoherent: openai 3.x itself requires Python >=3.10, so on 3.8 or 3.9 pip
# resolved SILENTLY down to an openai from two years ago and the customer got a
# client this SDK was never tested against. Claiming 3.8 support was the defect,
# not the openai floor.
#
# OpenAI 3.6 moved its transport boundary to the separately named `httpx2`
# distribution. The floors are the versions this SDK is tested against, with
# upper bounds.
# `nRouter._make_status_error` and the `_client.event_hooks` metadata capture
# both reach into OpenAI-SDK internals, so a major bump is a real break and must
# be an explicit, tested release rather than something a customer discovers.
dependencies = [
    "openai>=3.6.0,<4",
    "httpx2>=2.12.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://nrouter.ai"
Documentation = "https://nrouter.ai/docs"
Repository = "https://github.com/nRouterGateway/nrouter-sdk"
Issues = "https://github.com/nRouterGateway/nrouter-sdk/issues"

# Distribution name is `nrouter-sdk`; the import package stays `nroutersdk`.
# Hatchling cannot infer that from the project name, so name it explicitly —
# without this the wheel build fails to locate any package.
[tool.hatch.build.targets.wheel]
packages = ["nroutersdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
