group=ai.nrouter
version=3.1.3
android.useAndroidX=true

org.gradle.jvmargs=-Xmx2g

# No JDK location here: where a JDK lives is a property of the machine, and a
# committed path is read on every machine (a Windows build warned about the
# macOS paths that used to sit here). `jvmToolchain(11)` resolves a JDK 11 that
# Gradle auto-detects, or one named at invocation time:
#   ./gradlew build -Porg.gradle.java.installations.paths=/path/to/jdk-11
# scripts/test-all.sh does that for the Homebrew JDKs when they exist.
