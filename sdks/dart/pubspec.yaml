name: nrouter
description: nRouter SDK — one API key for models across six provider clouds. Works in Flutter and plain Dart.
version: 3.1.1
publish_to: none
homepage: https://nrouter.ai
repository: https://github.com/nRouterGateway/nrouter-sdk
issue_tracker: https://github.com/nRouterGateway/nrouter-sdk/issues
documentation: https://nrouter.ai/docs

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # `http` is the one dependency, and it is the reason this package works
  # unchanged on Flutter web, mobile, desktop and the Dart VM — `dart:io`
  # would compile out of a web build.
  http: ">=1.0.0 <2.0.0"

dev_dependencies:
  test: ^1.24.0
  lints: ^4.0.0
