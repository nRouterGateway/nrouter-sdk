name: Bug report
description: Something in an nRouter SDK does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        🛑 **Do not paste an API key, access token, or a request payload
        containing private data.** This repository is public and issue edit
        history is public too, so deleting it afterwards does not remove it.
        A key that has been posted must be rotated, not redacted.

        For a suspected **vulnerability**, do not open an issue at all — see
        [SECURITY.md](https://github.com/nRouterGateway/nrouter-sdk/blob/main/SECURITY.md).
  - type: dropdown
    id: sdk
    attributes:
      label: Which SDK?
      options: [python, javascript-typescript, java, kotlin, android, go, rust, swift, dart, r, not sure]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Package version
      description: e.g. nrouter-sdk 2.1.1, @nrouter_ai/sdk 1.1.2
    validations: { required: true }
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: e.g. Python 3.12.4, Node 22.23.2
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. Replace your key with `sk-nrouter-REDACTED`.
      render: text
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations: { required: true }
  - type: input
    id: request_id
    attributes:
      label: x-nr-request-id (optional)
      description: If the gateway answered, this header identifies the exact request in our logs and is by far the fastest route to a diagnosis.
