# Verify the source-only nRouter Android SDK.
#
# Android is not a registry-released supported package. This workflow builds,
# lints, tests, and locally publishes both linked JVM artifacts without release
# credentials or a dependency on an unpublished Maven Central staging upload.
name: verify-android

on:
  push:
    branches: [main]
    paths:
      - 'sdks/android/**'
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-android.yml'
  pull_request:
    paths:
      - 'sdks/android/**'
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'verify' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Publish Kotlin core to Maven Local
        working-directory: sdks/kotlin
        run: ./gradlew clean publishToMavenLocal --info

      - name: Run Android tests, lint, and local publish verification
        working-directory: sdks/android
        run: ./gradlew clean build publishToMavenLocal --info

      - name: Run cross-SDK conformance check
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      # ---- release ------------------------------------------------------
      # Only on a push to main, so a pull request keeps the credential-free
      # shape. Android depends on ai.nrouter:nrouter-sdk-kotlin at the SAME
      # coordinated version, so it can only publish once that artifact is on
      # Central -- the local publishToMavenLocal above is not enough for a
      # consumer resolving from the network.

      - name: Already on Central?
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: sdks/android
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          case "$VERSION" in
            '') echo "::error::no version= in sdks/android/gradle.properties"; exit 1 ;;
            *[!0-9.]*) echo "::error::version '$VERSION' is not a release version"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The Kotlin core must be on Central first or every consumer of this
          # artifact gets an unresolvable dependency. Publishing android against
          # a core that only exists in the runner's local repo ships a broken POM.
          core="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/ai/nrouter/nrouter-sdk-kotlin/$VERSION/nrouter-sdk-kotlin-$VERSION.pom")"
          if [ "$core" != "200" ]; then
            echo "::warning::nrouter-sdk-kotlin $VERSION is not on Central yet (HTTP $core); skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/ai/nrouter/nrouter-sdk-android/$VERSION/nrouter-sdk-android-$VERSION.pom")"
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::nrouter-sdk-android $VERSION is already on Central; nothing to do." ;;
            404) echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::Central answered $code; cannot tell whether $VERSION exists"; exit 1 ;;
          esac

      - name: Build, sign and stage
        if: steps.check.outputs.publish == 'true'
        working-directory: sdks/android
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew publishReleasePublicationToCentralStagingRepository

      - name: Refuse an unsigned bundle
        if: steps.check.outputs.publish == 'true'
        working-directory: sdks/android
        run: |
          # Count first: an empty staging directory would run the loop zero
          # times and report success having checked nothing.
          signable="$(find build/central-staging -type f \( -name '*.aar' -o -name '*.jar' -o -name '*.pom' \) | wc -l | tr -d ' ')"
          if [ "$signable" -lt 3 ]; then
            echo "::error::expected at least the aar, sources, javadoc and pom; found $signable"
            find build/central-staging -type f || true
            exit 1
          fi
          missing=0
          find build/central-staging -type f \( -name '*.aar' -o -name '*.jar' -o -name '*.pom' \) -print |
            while IFS= read -r f; do
              [ -f "$f.asc" ] || { echo "::error::unsigned: $f"; exit 1; }
            done || missing=1
          [ "$missing" -eq 0 ] || exit 1
          echo "all $signable aar/jar/pom artifacts carry a .asc signature"

      - name: Publish to Central
        if: steps.check.outputs.publish == 'true'
        working-directory: sdks/android
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          cd build/central-staging
          zip -qr ../central-bundle.zip .
          cd ..
          TOKEN="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          code="$(curl -s -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=nrouter-sdk-android-$VERSION&publishingType=AUTOMATIC")"
          echo "HTTP $code"; cat response.txt; echo
          [ "$code" = "201" ] || { echo "::error::Central upload failed"; exit 1; }

      - name: Verify Central serves it
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # A 201 is acceptance for validation, not publication.
          URL="https://repo1.maven.org/maven2/ai/nrouter/nrouter-sdk-android/$VERSION/nrouter-sdk-android-$VERSION.pom"
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
            [ "$code" = "200" ] && { echo "Central serves nrouter-sdk-android $VERSION"; exit 0; }
            sleep 30
          done
          echo "::error::Central did not serve $VERSION within 30 minutes."
          echo "::error::Check https://central.sonatype.com/publishing/deployments for a validation failure."
          exit 1
