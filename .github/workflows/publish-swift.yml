# Test and publish nRouter Swift SDK (SwiftPM / Swift Package Index), on merge to main.
#
# ONE workflow for Swift: it tests on macOS runner with Xcode / Swift toolchain,
# validates the SPM package manifest parity, and validates release tagging for Swift Package Index.
name: publish-swift

on:
  # SDKCI-003 — SWIFT PUBLISHES FROM A GIT TAG, so the tag is what must be
  # checked. The Swift Package Index indexes on the semver tag push itself, with no
  # workflow upload in between, and the release step below only
  # VERIFIES readiness — it uploads nothing. Before this filter existed NO
  # workflow in the repo had a `tags:` trigger at all, so every check ran
  # against the main commit PRECEDING the tag and `git push --tags` shipped an
  # unchecked tree by construction. That was true before the 2026-09-02 Actions
  # billing lock and would have stayed true after it cleared.
  #
  # THE PATTERN IS DOCUMENTED, NOT GUESSED. PUBLISHING.md:33 documents Swift as a BARE SemVer tag (`2.2.1`), NOT a
  # `sdks/swift/*` one — and the repo bears this out: `git tag` returns
  # `2.1.0 2.1.1 2.2.1` plus three `sdks/go/*`, and ZERO swift-namespaced tags.
  # An `sdks/swift/v*` pattern would have been a trigger that fires never.
  #
  # `tags:` is a key INSIDE the existing `push:` mapping, never a second
  # `push:`. YAML takes the last duplicate key, so a separate block silently
  # DELETES `branches: [main]` — and the workflow still parses, which is what
  # makes it dangerous. Pinned by tests/test_tag_publish_gated.py.
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'sdks/swift/**'
      - 'Package.swift'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-swift.yml'
  pull_request:
    paths:
      - 'sdks/swift/**'
      - 'Package.swift'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Test Root Package Manifest
        run: swift test --enable-code-coverage

      - name: Test Nested SDK Package Manifest
        working-directory: sdks/swift
        run: swift test --enable-code-coverage

      - name: Run cross-SDK conformance check
        run: python3 conformance/check_conformance.py

      - name: Validate Swift Package Index Compatibility (Release Template)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Validating SwiftPM package metadata and documentation targets..."
          swift package dump-package > /dev/null
          echo "Package is ready for Swift Package Index indexing upon semver git tag push."
