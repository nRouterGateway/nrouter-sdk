# Unified multi-language CI workflow for nRouter SDKs.
# Runs on every pull request and on main push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  conformance-and-guards:
    name: Conformance & Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - name: Install Python dependencies for contract testing
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e "sdks/python[dev]"

      - name: Static catalog-count guard
        run: bash tests/sdk-static-catalog-count.test.sh

      # README.md must name every spec error code and x-nr-* header, and any
      # code count it states must equal the spec's. Pure python3 + the spec;
      # no key, no network.
      - name: README spec-parity guard self-test
        run: bash tests/readme-spec-parity.test.sh --self-test

      - name: README spec-parity guard
        run: bash tests/readme-spec-parity.test.sh

      - name: Cross-SDK conformance gate self-test
        run: python3 conformance/check_conformance.py --self-test

      - name: Cross-SDK conformance gate
        run: python3 conformance/check_conformance.py

      - name: SDK contract tests
        run: python3 -m pytest tests/test_sdk_contract.py tests/test_release_versions.py tests/test_tag_publish_gated.py tests/test_agents_contract.py

      - name: Install pinned security scanners
        run: |
          python3 -m pip install pip-audit==2.10.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1

      - name: Dependency security audit
        run: bash scripts/security-audit.sh

  typescript-js:
    name: TypeScript & JavaScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdks/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Build TypeScript bundle & types
        run: npm run build

      - name: Verify pnpm and Bun consumers
        run: |
          set -euo pipefail
          pkg="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          pkg="$RUNNER_TEMP/$pkg"

          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          npm install -g bun@1.4.2 --registry=https://registry.npmjs.org

          pnpm_dir="$RUNNER_TEMP/nrouter-pnpm-consumer"
          mkdir "$pnpm_dir"
          cd "$pnpm_dir"
          pnpm init
          pnpm add "$pkg"
          pnpm add -D typescript
          printf '%s\n' "const sdk = require('@nrouter_ai/sdk'); if (typeof sdk.nRouter !== 'function' || typeof sdk.default !== 'function' || sdk.default !== sdk.nRouter) process.exit(1);" > cjs.cjs
          printf '%s\n' "import nRouter, { nRouter as NamedRouter } from '@nrouter_ai/sdk'; if (typeof nRouter !== 'function' || typeof NamedRouter !== 'function' || nRouter !== NamedRouter) process.exit(1);" > esm.mjs
          printf '%s\n' "import nRouter, { nRouter as NamedRouter } from '@nrouter_ai/sdk'; const a = new nRouter({ apiKey: 'sk-nrouter-test' }); const b = new NamedRouter({ apiKey: 'sk-nrouter-test' }); console.log(typeof a.nr, typeof b.nr);" > types.ts
          node cjs.cjs
          node esm.mjs
          pnpm exec tsc --module NodeNext --moduleResolution NodeNext --target ES2022 --strict --noEmit types.ts

          bun_dir="$RUNNER_TEMP/nrouter-bun-consumer"
          mkdir "$bun_dir"
          cd "$bun_dir"
          bun init -y
          bun add "$pkg"
          cp "$pnpm_dir/cjs.cjs" "$pnpm_dir/esm.mjs" "$pnpm_dir/types.ts" .
          bun cjs.cjs
          bun esm.mjs
          bun types.ts

      # The mock-gateway half of the demo E2E suite: step 0's static preflight
      # (example .env documentation and the .env ignore rules that keep a key
      # off this PUBLIC repo) plus the in-process gateway suites for the voice,
      # chat, image and video examples. Each suite starts its own gateway, so it
      # needs NO API key, NO network and NO credits, and it runs in a few
      # seconds. It consumes the sdks/js/dist build produced by the step above,
      # so it must stay after it, and it runs from the repository root rather
      # than this job's sdks/js default.
      #
      # Two things stop this printing green while checking nothing. The script
      # owns the count: `assert_steps_run` fails the run when fewer suites
      # executed than the mode promised, and an unrecognised flag exits 2 rather
      # than falling through. This step owns the reach: `pipefail` keeps the
      # script's exit status through the tee, and the banner grep proves the run
      # ended on the --mock-only success path rather than some earlier exit 0
      # (--static-only prints a different banner). The suite COUNT is
      # deliberately not repeated here -- it is derived in the script, and a
      # number hand-typed in this file would drift the moment a suite is added.
      - name: Mock-gateway example suites (no key, no network)
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          bash tests/demo-e2e-record.test.sh --mock-only \
            | tee "$RUNNER_TEMP/mock-only.log"
          grep -q 'MOCK-GATEWAY SUITES PASSED' "$RUNNER_TEMP/mock-only.log"

  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy type checker
        run: mypy nroutersdk

      - name: Run ruff linter
        run: ruff check nroutersdk

      - name: Run pytest suite
        run: python -m pytest

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven test suite
        run: mvn -B clean test

  swift:
    name: Swift SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test root Package.swift
        run: swift test

      - name: Test sdks/swift Package.swift
        working-directory: sdks/swift
        run: swift test

  kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Gradle tests
        run: ./gradlew test --stacktrace

  # The agent list is DERIVED from agents/*/package.json, never hand-typed, so
  # a new agent is covered the moment it lands. An agent without a committed
  # package-lock.json fails here rather than being silently skipped, and an
  # empty list fails rather than letting the matrix report green over nothing.
  agents-discover:
    name: Discover agents
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List agent packages
        id: list
        run: |
          set -euo pipefail
          dirs="$(find agents -mindepth 2 -maxdepth 2 -name package.json -exec dirname {} \; | sort)"
          if [ -z "$dirs" ]; then
            echo "::error::no agents/*/package.json found"
            exit 1
          fi
          missing=0
          while IFS= read -r d; do
            if [ ! -f "$d/package-lock.json" ]; then
              echo "::error::$d has no package-lock.json (npm ci needs one)"
              missing=1
            fi
          done <<< "$dirs"
          [ "$missing" -eq 0 ]
          json="$(printf '%s\n' "$dirs" | jq -R . | jq -cs .)"
          echo "agents=$json" >> "$GITHUB_OUTPUT"
          echo "Agents: $json"

  # Offline only: typecheck, unit tests, build and a dry-run pack. No secrets,
  # no API key, no live calls (the Playwright `e2e` script is deliberately not
  # run here).
  agents:
    name: Agent (${{ matrix.agent }})
    needs: agents-discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.agents-discover.outputs.agents) }}
    defaults:
      run:
        working-directory: ${{ matrix.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.agent }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run
