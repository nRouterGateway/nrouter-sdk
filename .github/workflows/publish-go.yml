# Test and publish nRouter Go SDK (`github.com/nRouterGateway/nrouter-sdk/sdks/go/v3`), on merge to main.
#
# ONE workflow for Go: formats, vets, tests with race detector, runs conformance,
# and verifies proxy.golang.org tag readiness.
name: publish-go

on:
  # SDKCI-003 — GO PUBLISHES FROM A GIT TAG, so the tag is what must be
  # checked. proxy.golang.org resolves `refs/tags/sdks/go/v*` straight from this repo
  # (`Origin.VCS` is `git`, not a CI upload), and the release step below only
  # VERIFIES readiness — it uploads nothing. Before this filter existed NO
  # workflow in the repo had a `tags:` trigger at all, so every check ran
  # against the main commit PRECEDING the tag and `git push --tags` shipped an
  # unchecked tree by construction. That was true before the 2026-09-02 Actions
  # billing lock and would have stayed true after it cleared.
  #
  # THE PATTERN IS DOCUMENTED, NOT GUESSED. PUBLISHING.md:34 documents Go as an `sdks/go/v*` tag; the repo carries
  # `sdks/go/v1.0.0`, `v1.0.1` and `v2.2.1`.
  #
  # `tags:` is a key INSIDE the existing `push:` mapping, never a second
  # `push:`. YAML takes the last duplicate key, so a separate block silently
  # DELETES `branches: [main]` — and the workflow still parses, which is what
  # makes it dangerous. Pinned by tests/test_tag_publish_gated.py.
  push:
    branches: [main]
    tags:
      - 'sdks/go/v*'
    paths:
      - 'sdks/go/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-go.yml'
  pull_request:
    paths:
      - 'sdks/go/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.21'

      - name: Format check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v -race -count=1 ./...

      - name: Run cross-SDK conformance check
        working-directory: .
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Verify Module Path & Proxy Format (Release Template)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          MAJOR="${VERSION%%.*}"
          grep -Fx "module github.com/nRouterGateway/nrouter-sdk/sdks/go/v$MAJOR" go.mod
          echo "Go module is ready for proxy.golang.org tag sdks/go/v$VERSION."
