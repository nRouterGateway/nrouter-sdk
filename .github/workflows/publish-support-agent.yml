# Publish @nrouter_ai/support-agent to npm, on merge to main.
#
# The same shape and the same controls as publish-npm.yml, pointed at
# agents/customer-support-agent. Read that file's comments for the reasoning
# behind each control; they are repeated here only where the package differs.
#
# RELEASE PROCEDURE:
#
#     bump "version" in agents/customer-support-agent/package.json -> merge -> it ships
#
# and a merge without a bump is a green no-op (the `already published?` step).
#
# NO REPO SECRET. npm trusted publishing (OIDC) against a trusted publisher
# registered on @nrouter_ai/support-agent for THIS repository and THIS workflow
# FILENAME — renaming this file breaks publishing until the registration is
# updated. There is no manual fallback: a laptop publish cannot carry
# provenance.
name: npm-support-agent

on:
  push:
    branches: [main]
    paths:
      - 'agents/customer-support-agent/**'
      - '.github/workflows/publish-support-agent.yml'
  # Advisory checks for outside pull requests, exactly as in publish-npm.yml:
  # this repository is public, and without this trigger a contributor's code
  # would first execute in the run that publishes it. Not a required check.
  pull_request:
    paths:
      - 'agents/customer-support-agent/**'
      - '.github/workflows/publish-support-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-support-agent-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false   # never cancel a run that may be mid-upload

jobs:
  # The untrusted half: `npm ci` runs install scripts and the tests run the
  # dependency tree. NO `id-token` permission here.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    defaults:
      run:
        working-directory: agents/customer-support-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agents/customer-support-agent/package-lock.json

      - run: npm ci

      # Unit suite (includes the public-leak, dependency and no-raw-fetch
      # guards), typecheck and build. The Playwright e2e needs a live API key
      # and runs from a maintainer's machine, never here.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Already published?
        id: check
        run: |
          set -euo pipefail
          PKG=@nrouter_ai/support-agent

          name="$(node -p "require('./package.json').name")"
          if [ "$name" != "$PKG" ]; then
            echo "::error::package.json declares '$name'; this workflow only publishes $PKG"; exit 1
          fi

          # The runtime dependency surface is part of the product promise: one
          # dependency, the SDK, exact-pinned. Refuse to ship anything else.
          node -e '
            const d = require("./package.json").dependencies ?? {};
            const names = Object.keys(d);
            if (names.length !== 1 || names[0] !== "@nrouter_ai/sdk" || !/^[0-9]+\.[0-9]+\.[0-9]+$/.test(d["@nrouter_ai/sdk"])) {
              console.error("::error::dependencies must be exactly an exact-pinned @nrouter_ai/sdk; got " + JSON.stringify(d));
              process.exit(1);
            }
          '

          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # Exactly three numeric segments. npm normalises `1.2` to `1.2.0` on
          # upload, which would turn the post-publish "serves it" check red on a
          # successful release.
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$v' is not a stable MAJOR.MINOR.PATCH version"; exit 1
          fi

          if npm view "$PKG@$v" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG@$v is already on npm — nothing to do. Bump the version to release."
            exit 0
          fi

          # Newer than latest, or this publish would move `latest` backwards.
          if latest="$(npm view "$PKG" version 2>/tmp/e)"; then
            newest="$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)"
            if [ "$newest" != "$v" ]; then
              echo "::error::$v is older than the published latest ($latest); publishing it would downgrade every fresh install"
              exit 1
            fi
          elif grep -qiE '404|E404|not found' /tmp/e; then
            echo "::notice::$PKG has no published version yet; $v will be the first"
          else
            echo "::error::could not read the published version from npm, so a downgrade cannot be ruled out:"
            cat /tmp/e >&2; exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Only dist/ crosses into the publish job; package.json, bin/, README and
      # LICENSE come from that job's own clean checkout.
      - name: Hand the built package to the publish job
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-agent-dist
          path: agents/customer-support-agent/dist
          if-no-files-found: error
          retention-days: 1

  # THE ONLY JOB THAT MAY MINT AN OIDC TOKEN. It installs no repository
  # dependency and runs no repository script.
  publish:
    needs: verify
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    defaults:
      run:
        working-directory: agents/customer-support-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # RUNS FIRST — the order is the control (see publish-npm.yml). The
      # package sits two levels below the repository root, like sdks/js.
      - name: Refuse a repository-controlled npm config
        run: |
          set -euo pipefail
          for f in ../../.npmrc ../.npmrc ./.npmrc; do
            if [ -e "$f" ]; then
              echo "::error::$f exists; a repository-controlled npm config can redirect the publish registry and with it the token"
              exit 1
            fi
          done

          node -e '
            const pc = require("./package.json").publishConfig ?? {};
            const allowed = { access: "public" };
            const bad = Object.entries(pc).filter(([k, v]) => allowed[k] !== v);
            if (bad.length) {
              console.error("::error::package.json publishConfig may contain only {access:\"public\"}; refusing: " +
                bad.map(([k, v]) => k + "=" + JSON.stringify(v)).join(", "));
              process.exit(1);
            }
          '

          eff="$(npm config get registry)"
          if [ "$eff" != "https://registry.npmjs.org/" ]; then
            echo "::error::effective npm registry is '$eff', not registry.npmjs.org"
            exit 1
          fi
          echo "registry confirmed: $eff"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm 11.19.1, the floor for OIDC trusted publishing
        run: |
          npm install -g npm@11.19.1 --registry=https://registry.npmjs.org
          npm --version

      - name: Restore the verified build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: support-agent-dist
          path: agents/customer-support-agent/dist

      - name: Publish
        run: npm publish --access public --provenance --ignore-scripts

      - name: Verify the registry serves it
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            [ "$(npm view '@nrouter_ai/support-agent' version)" = "$V" ] && exit 0
            sleep 10
          done
          echo "::error::could not confirm npm is serving $V within 5 minutes. The upload SUCCEEDED; check https://www.npmjs.com/package/@nrouter_ai/support-agent rather than republishing."
          exit 1
