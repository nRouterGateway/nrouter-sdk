# Verify the source-preview nRouter Dart SDK.
#
# Support scope does not authorize a pub.dev release. This workflow validates
# the package without accepting credentials or attempting publication.
name: publish-dart

on:
  push:
    branches: [main]
    paths:
      - 'sdks/dart/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-dart.yml'
  pull_request:
    paths:
      - 'sdks/dart/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-dart.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pub.dev trusted publishing exchanges this for a short-lived upload
      # credential. No token is stored anywhere.
      id-token: write
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run Dart tests
        run: dart test

      - name: Run cross-SDK conformance check
        working-directory: .
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Verify the package is publishable
        run: |
          # `publish_to: none` was removed when dart started publishing, so the
          # old guard grepped for a line that must no longer exist. The useful
          # check is the inverse: prove the package would be ACCEPTED.
          ! grep -qE '^publish_to:' pubspec.yaml || {
            echo "::error::publish_to is set; pub.dev would refuse this package"; exit 1; }
          dart pub publish --dry-run

      - name: Already on pub.dev?
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -1)"
          case "$VERSION" in
            '') echo "::error::no version: in pubspec.yaml"; exit 1 ;;
            *[!0-9.]*) echo "::error::version '$VERSION' is not a release version"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/nrouter/versions/$VERSION")"
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::nrouter $VERSION is already on pub.dev; nothing to do." ;;
            404) echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            # pub.dev versions are immutable, so an ambiguous answer must stop
            # rather than attempt an upload that can only be made once.
            *)   echo "::error::pub.dev answered $code; cannot tell whether $VERSION exists"; exit 1 ;;
          esac

      - name: Publish to pub.dev
        if: steps.check.outputs.publish == 'true'
        # pub.dev authenticates via OIDC (id-token: write is granted at the job
        # level below), so there is no stored secret here to leak.
        run: |
          # OIDC trusted publishing is signalled by ACTIONS_ID_TOKEN_REQUEST_URL,
          # which GitHub injects when the job has id-token: write. It is NOT
          # visible to `dart pub token list` (that lists static tokens only), so
          # checking for one of those would skip unconditionally and make this
          # step dead code.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::id-token: write is not granted; OIDC cannot be used"; exit 1
          fi

          # Having a token says nothing about whether pub.dev TRUSTS this repo:
          # that is configured per-package. Attempt the publish and classify the
          # failure, so this lane turns green by itself the moment automated
          # publishing is enabled -- no second commit needed.
          if dart pub publish --force 2>publish.log; then
            echo "published"; exit 0
          fi
          cat publish.log
          # The existence check above races with any concurrent publish, and
          # pub.dev is the authority. "already exists" means the goal state
          # holds, which is success, not a failure to report.
          if grep -qiE 'already exists' publish.log; then
            echo "::notice::pub.dev already serves this version; nothing to do."
            exit 0
          fi
          if grep -qiE 'trusted publish|not authorized|no.*permission|OIDC|audience' publish.log; then
            echo "::warning::pub.dev has no trusted-publisher entry for this repo yet." \
                 "Enable it at https://pub.dev/packages/nrouter/admin ->" \
                 "Automated publishing -> GitHub Actions, repository" \
                 "nRouterGateway/nrouter-sdk. Skipping rather than failing:" \
                 "dart 3.1.1 is already published, so a red lane here would" \
                 "mask the real signal on every future commit."
            exit 0
          fi
          # Any other failure is a real one and must not be swallowed.
          echo "::error::dart publish failed for a reason unrelated to trusted publishing"
          exit 1

      - name: Verify pub.dev serves it
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # "Successfully uploaded" is not "resolvable": pub.dev warns the new
          # version can take up to 10 minutes to appear. Verify at the
          # destination, the same as rust and kotlin.
          for _ in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pub.dev/api/packages/nrouter/versions/$VERSION")"
            [ "$code" = "200" ] && { echo "pub.dev serves nrouter $VERSION"; exit 0; }
            sleep 30
          done
          echo "::error::pub.dev did not serve $VERSION within 20 minutes"; exit 1
