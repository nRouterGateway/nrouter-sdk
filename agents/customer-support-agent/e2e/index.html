<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Support Agent Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #111; line-height: 1.5; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 0.5rem; padding: 0.5rem 1.25rem; font-size: 1rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-bar { display: flex; gap: 1.5rem; margin: 1rem 0; font-size: 0.875rem; color: #444; }
    .citations, .steps { margin: 0.5rem 0; display: flex; flex-direction: column; gap: 0.25rem; }
    .citations a { color: #0066cc; text-decoration: underline; }
    .answer-box { margin-top: 1rem; padding: 1rem; background: #f9f9f9; border: 1px solid #e5e5e5; border-radius: 4px; min-height: 2rem; white-space: pre-wrap; }
    .error-box { color: #c00; margin-top: 0.5rem; font-weight: 500; }
    .done-badge { display: inline-block; margin-top: 0.5rem; padding: 0.25rem 0.5rem; background: #e6f4ea; color: #137333; border-radius: 4px; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>Customer Support Agent</h1>
  <main>
    <form id="chat-form">
      <label for="question">Ask a question</label>
      <textarea id="question" data-testid="question" name="question" rows="3" placeholder="How can we help you?"></textarea>
      <div><button id="send" data-testid="send" type="submit">Send</button></div>
    </form>

    <div class="status-bar">
      <div>Confidence: <span data-testid="confidence"></span></div>
      <div>Cost: <span data-testid="cost"></span></div>
    </div>

    <div id="steps-container" class="steps"></div>
    <div id="citations-container" class="citations"></div>

    <div class="answer-box" data-testid="answer" aria-live="polite"></div>
    <div data-testid="error" class="error-box" role="alert"></div>
    <div data-testid="done" class="done-badge" style="display: none;">Done</div>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const questionEl = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const answerEl = document.querySelector('[data-testid="answer"]');
    const confidenceEl = document.querySelector('[data-testid="confidence"]');
    const costEl = document.querySelector('[data-testid="cost"]');
    const errorEl = document.querySelector('[data-testid="error"]');
    const doneEl = document.querySelector('[data-testid="done"]');
    const stepsContainer = document.getElementById('steps-container');
    const citationsContainer = document.getElementById('citations-container');

    const history = [];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = questionEl.value.trim();
      if (!content) return;

      history.push({ role: 'user', content });
      questionEl.value = '';
      sendBtn.disabled = true;

      answerEl.textContent = '';
      confidenceEl.textContent = '';
      costEl.textContent = '';
      errorEl.textContent = '';
      stepsContainer.replaceChildren();
      citationsContainer.replaceChildren();
      doneEl.style.display = 'none';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });

        if (!res.ok) {
          errorEl.textContent = 'Request failed (' + res.status + ')';
          doneEl.style.display = 'inline-block';
          sendBtn.disabled = false;
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let currentAnswer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') {
              doneEl.style.display = 'inline-block';
              continue;
            }

            try {
              const ev = JSON.parse(data);
              if (ev.choices && ev.choices[0]?.delta?.content) {
                currentAnswer += ev.choices[0].delta.content;
                answerEl.textContent = currentAnswer;
              } else if (ev.nrouter_event === 'confidence') {
                confidenceEl.textContent = ev.level || '';
              } else if (ev.nrouter_event === 'citations' && Array.isArray(ev.citations)) {
                citationsContainer.replaceChildren();
                for (const c of ev.citations) {
                  const a = document.createElement('a');
                  a.setAttribute('data-testid', 'citation');
                  a.href = c.url;
                  a.textContent = c.title;
                  citationsContainer.appendChild(a);
                }
              } else if (ev.nrouter_event === 'cost') {
                costEl.textContent = ev.status === 'exact' ? ('exact:' + ev.costUsd) : 'unpriced';
              } else if (ev.nrouter_event === 'tool_call') {
                const step = document.createElement('div');
                step.setAttribute('data-testid', 'step');
                step.textContent = (ev.title || ev.tool) + ' [' + ev.status + ']';
                stepsContainer.appendChild(step);
              } else if (ev.nrouter_event === 'error') {
                errorEl.textContent = ev.message || ev.code || 'Error';
              }
            } catch (_) {}
          }
        }

        if (buffer.trim()) {
          const line = buffer.trim();
          if (line.startsWith('data: ') && line.slice(6) === '[DONE]') {
            doneEl.style.display = 'inline-block';
          }
        }

        if (currentAnswer) {
          history.push({ role: 'assistant', content: currentAnswer });
        }
      } catch (err) {
        errorEl.textContent = err.message || 'Error occurred';
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
